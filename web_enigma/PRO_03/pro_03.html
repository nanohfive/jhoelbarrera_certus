<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Problema 03</title>
    </head>
    <body>
        <h1>
            Solicita mediante prompt() el año de nacimiento de una persona.
            Calcula y muestra su edad aproximada utilizando el año actual.
        </h1>
        <script>
            let añoNacimiento = prompt("Ingresa tu año de nacimiento");
            document.write(
                `<p>Tu edad aproximada es: ${2026 - añoNacimiento} años</p>`,
            );
        </script>
    </body>
</html>
