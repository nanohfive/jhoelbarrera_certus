<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Actividad Aplicativa - Anexo 2</title>
    </head>
    <body>
        <center>
            <header>
                <h1>TechNova</h1>
                <h2>Tecnología para tu día a día</h2>
            </header>
            <nav>
                <ul>
                    <li>Inicio</li>
                    <li>Productos</li>
                    <li>Ofertas</li>
                    <li>Contacto</li>
                </ul>
            </nav>
            <main>
                <section>
                    <h3>Horario de Atención</h3>
                    <table border="1">
                        <tr>
                            <td>Día</td>
                            <td>Horario</td>
                        </tr>
                        <tr>
                            <td>Lunes a Viernes</td>
                            <td>9:00 a. m. - 7:00 p. m.</td>
                        </tr>
                        <tr>
                            <td>Sábados</td>
                            <td>10:00 a. m. - 5:00 p. m.</td>
                        </tr>
                        <tr>
                            <td>Domingos</td>
                            <td>Cerrado</td>
                        </tr>
                    </table>
                </section>
                <section>
                    <h3>Contactanos</h3>
                    <form>
                        <label for="nombre"
                            >Nombre: <input type="text" id="nombre" /></label
                        ><br />
                        <label for="correo"
                            >Correo:
                            <input type="email" id="correo" required /></label
                        ><br />
                        <textarea
                            id="mensaje"
                            rows="5"
                            cols="40"
                            placeholder="Escribe tu mensaje aquí..."
                        ></textarea
                        ><br />
                        <button type="submit">Enviar mensaje</button>
                    </form>
                </section>
            </main>
            <footer>
                <p>© 2026 TechNova — Todos los derechos reservados.</p>
            </footer>
        </center>
    </body>
</html>
